context:
  name: occupancy-model-tasks
  version: ${{ env.get("HATCH_VCS_VERSION") }}


package:
  name: ${{ name }}
  version: ${{ version }}


source:
  path: ../../..  # get back to root of repo

build:
  noarch: python
  script: SETUPTOOLS_SCM_PRETEND_VERSION=${{ version }} python -m pip install src/ -vv --no-deps
  number: 0

requirements:
  host:
    - python
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python
    - pip
    - wt-registry >=0.2.0,<0.3.0
    - wt-task >=0.1.3,<1.0.0
    - ecoscope-platform >=2.25.0,<3.0.0
    - ecoscope
    - pymc
    - pytensor
    - arviz
    - earthengine-api
    - rasterio
    - contourpy
    - plotly
    - geopandas
    - shapely
    - numpy
    - pandas
    - scipy
    - pydantic >=2.0.0,<3.0.0

about:
  license: BSD-3-Clause

extra:
  recipe-maintainers:
    - atmorling
    - walljcg
