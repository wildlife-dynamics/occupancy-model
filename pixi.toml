[workspace]
name = "occupancy-model"
channels = [
  # Uncomment to resolve against a local `pixi run build-release` output, so the
  # tasks env picks up a freshly built occupancy-model-tasks before publish. Only
  # works once that dir holds a built channel (no repodata there otherwise).
  # "file:///tmp/ecoscope-workflows-custom/release/artifacts/",
  'https://repo.prefix.dev/ecoscope-workflows/',
  'conda-forge',
  'https://repo.prefix.dev/ecoscope-workflows-custom/',
]
platforms = ['linux-64', 'osx-arm64', 'win-64']

[tool.wt]
# When true, PRs to `main` must come from `staging` or `patch-*` (enforced by
# .github/workflows/guard-main-prs.yml). Set to false for repos that have not
# cut a release yet to allow PRs directly to `main`.
published = false

[dependencies]
wt-compiler = ">=0.10.1, <0.11"
graphviz = "*"
go-yq = "*"
# Toolchain for publish/build.sh: hatch resolves HATCH_VCS_VERSION, rattler-build
# builds and uploads the recipe.
rattler-build = "*"
hatch = "*"
hatch-vcs = "*"
pip = "*"

[tasks]
build-release = './publish/build.sh'

# ---- task-package development (unit tests); not used by CI's compile/test ----
[feature.tasks]
channels = [
  'https://repo.prefix.dev/ecoscope-workflows/',
  'https://repo.prefix.dev/ecoscope-workflows-custom/',
  'conda-forge',
]
platforms = ['linux-64', 'osx-arm64']

[feature.tasks.dependencies]
python = "3.12.*"
ecoscope-platform = ">=2.25.0,<3.0.0"
ecoscope-workflows-ext-custom = ">=0.1.1"
pydeck = { version = "==0.9.2", channel = "conda-forge" }
pytest = "*"
hatchling = "*"
hatch-vcs = "*"

[feature.tasks.pypi-dependencies]
occupancy-model-tasks = { path = "src", editable = true }

[feature.tasks.tasks]
test-tasks = "pytest -q tests/tasks"

[environments]
tasks = { features = ["tasks"], no-default-feature = true }
